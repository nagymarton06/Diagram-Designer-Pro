    <style>
        /* Természetes, visszafogott iOS Frosted Glass stílus */
        .ios-glass {
            background: rgba(18, 20, 26, 0.55);
            backdrop-filter: blur(30px) saturate(160%);
            -webkit-backdrop-filter: blur(30px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .ios-glass-card {
            background: rgba(24, 26, 32, 0.45);
            backdrop-filter: blur(24px) saturate(150%);
            -webkit-backdrop-filter: blur(24px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .ios-input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);

            transition: all 0.2s ease;

        .ios-input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);

        .btn-indigo-glass {

            border: 1px solid rgba(99, 102, 241, 0.4);

            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);

        .btn-indigo-glass:hover {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.35) 0%, rgba(79, 70, 229, 0.25) 100%);
            border-color: rgba(99, 102, 241, 0.7);
            color: #ffffff;
            transform: translateY(-2px);

        ::-webkit-scrollbar { width: 8px; height: 8px; }

</head>

    <script type="text/babel">
        const { useState, useRef, useEffect, useCallback } = React;

        // --- ICONS ---
        const Icons = {

            Palette: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"></path></svg>,
            Settings: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>,

        const i18n = {

                warning100: "Exceeded 100%!",
                warningN: "Exceeded sample size!",
                btnReverse: "⇄ Reverse",
                btnAdd: "+ Add Row",
                btnResetPos: "⟲ Reset Positions",
                showPct: "Show Percentage (%)",
                showN: "Show Sample Size (n=)",
                saveBg: "EXPORT BACKGROUND",
                bgWhite: "White", bgDark: "Dark", bgNone: "Transparent",
                btnDownloadBase: "DOWNLOAD",
                defLabelA: "Group A",
                defLabelB: "Group B",
                palModern: "Modern", palRetro: "Retro", palForest: "Forest", palSun: "Sunshine", palDeep: "Deep Blue", palPurple: "Purple",
                aspectRatioLabel: "ASPECT RATIO",
                resolutionLabel: "RESOLUTION (QUALITY)",
                customResLabel: "Custom Size (px)",
                modeLandscape: "Landscape",
                modePortrait: "Portrait",
                modeSquare: "1:1 Square",
                dragHint: "Tip: You can drag and drop label text directly on the canvas!"
            }
        };

        const CHART_TYPES = (lang) => [
            { id: "donut",   label: i18n[lang].donut,      icon: "◎" },
            { id: "pie",     label: i18n[lang].pie,        icon: "⬤" },
            { id: "bar",     label: i18n[lang].bar,        icon: "▐" },
            { id: "hbar",    label: i18n[lang].hbar,       icon: "▬" },
            { id: "line",    label: i18n[lang].line,       icon: "∿" },
            { id: "scatter", label: i18n[lang].scatter,    icon: "⁙" },
        ];

        const PALETTES = (lang) => [
            { name: i18n[lang].palModern, colors: ["#6366f1","#ec4899","#8b5cf6","#3b82f6","#14b8a6","#f59e0b","#f43f5e","#10b981","#84cc16"] },
            { name: i18n[lang].palRetro,  colors: ["#E63946","#457B9D","#1D3557","#F4A261","#2A9D8F","#E9C46A","#264653","#F77F00","#8D99AE"] },
            { name: i18n[lang].palForest, colors: ["#2D6A4F","#40916C","#52B788","#74C69D","#95D5B2","#B7E4C7","#D8F3DC","#1B4332","#004B23"] },
            { name: i18n[lang].palSun,    colors: ["#FFD000","#FFB300","#FFA000","#FF8F00","#FF6F00","#E65100","#FB8C00","#F57C00","#EF6C00"] },
            { name: i18n[lang].palDeep,   colors: ["#03045E","#023E8A","#0077B6","#0096C7","#00B4D8","#48CAE4","#90E0EF","#ADE8F4","#E0F2FE"] },
            { name: i18n[lang].palPurple, colors: ["#4C1D95","#5B21B6","#6D28D9","#7C3AED","#8B5CF6","#A78BFA","#C4B5FD","#DDD6FE","#EDE9FE"] },
        ];

        const SectionHeader = ({ icon, title }) => (
            <div className="flex items-center justify-between border-b border-white/10 pb-3 mb-4 mt-2">
                <div className="flex items-center gap-2.5">
                    <div className="w-7 h-7 rounded-lg bg-indigo-500/15 flex items-center justify-center text-indigo-400">
                        {icon}
                    </div>
                    <h2 className="font-bold text-base text-zinc-100">{title}</h2>
                </div>
            </div>
        );

        const Toggle = ({value, onChange}) => (
            <label className="inline-flex items-center cursor-pointer select-none shrink-0">
                <input type="checkbox" className="sr-only peer" checked={value} onChange={(e) => onChange(e.target.checked)} />
                <div className={`w-10 h-5 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-5 peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-zinc-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all relative peer-checked:bg-indigo-600 shadow-inner ${value ? '' : 'bg-[#27272a]'}`}></div>
            </label>
        );

        function App() {
            const canvasRef = useRef(null);
            const labelBoxesRef = useRef([]);
            const draggingIndexRef = useRef(null);

            const [isDarkMode, setIsDarkMode] = useState(true);
            const [lang, setLang] = useState("hu");
            const [chartType, setChartType] = useState("donut");
            const [n, setN] = useState("200");
            const [nPos, setNPos] = useState("ja");
            const [showN, setShowN] = useState(true);
            const [showPct, setShowPct] = useState(true);
            const [downloadMode, setDownloadMode] = useState("dark"); 
            const [isMonochrome, setIsMonochrome] = useState(false);
            const [monoColor, setMonoColor] = useState("#6366f1");
            
            // Aktív színséma megőrzése az új sorok automatikus színéhez
            const [currentPaletteColors, setCurrentPaletteColors] = useState(PALETTES("hu")[0].colors);

            // Képarány & Főcsoport (Fekvő, Álló, 1:1)
            const [aspectGroup, setAspectGroup] = useState("landscape");
            const [aspectRatio, setAspectRatio] = useState("16:9");
            
            // Felbontás: alapértelmezetten a sima HD (2x)
            const [exportScale, setExportScale] = useState(2);
            const [isCustomRes, setIsCustomRes] = useState(false);
            const [customWidth, setCustomWidth] = useState("1920");
            const [customHeight, setCustomHeight] = useState("1080");

            const [rows, setRows] = useState([
                { label: i18n.hu.defLabelA, pct: "70", color: "#6366f1" },
                { label: i18n.hu.defLabelB, pct: "30", color: "#ec4899" }
            ]);

            const t = i18n[lang];

            useEffect(() => {
                if (isDarkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [isDarkMode]);

            const toggleLang = () => {
                const newLang = lang === 'hu' ? 'en' : 'hu';
                const oldT = i18n[lang];
                const newT = i18n[newLang];
                
                const updatedRows = rows.map(r => {
                    if (r.label === oldT.defLabelA) return { ...r, label: newT.defLabelA };
                    if (r.label === oldT.defLabelB) return { ...r, label: newT.defLabelB };
                    return r;
                });
                
                const posMapping = {
                    hu: { bf: 'tl', jf: 'tr', ba: 'bl', ja: 'br' },
                    en: { tl: 'bf', tr: 'jf', bl: 'ba', br: 'ja' }
                };
                if (posMapping[lang][nPos]) setNPos(posMapping[lang][nPos]);

                setRows(updatedRows);
                setLang(newLang);
            };

            const totalSum = rows.reduce((acc, row) => acc + (parseFloat(row.pct) || 0), 0);
            const targetN = parseFloat(n) || 0;
            const is100 = Math.abs(totalSum - 100) < 0.01;
            const isSumMatchingN = Math.abs(totalSum - targetN) < 0.01;
            const hasExceededN = totalSum > targetN;
            const validatorError = showPct ? (totalSum > 100) : hasExceededN;

            const reverseColors = () => {
                if (isMonochrome) return;
                const newRows = [...rows];
                const colors = newRows.map(r => r.color).reverse();
                newRows.forEach((r, i) => r.color = colors[i]);
                setRows(newRows);
            };

            const applyPalette = (palette) => {
                setIsMonochrome(false);
                setCurrentPaletteColors(palette.colors);
                const newRows = rows.map((r, i) => ({
                    ...r,
                    color: palette.colors[i % palette.colors.length]
                }));
                setRows(newRows);
            };

            // Új adatsor hozzáadása: a paletta soron következő színét kapja automatikusan
            const addNewRow = () => {
                const nextColor = isMonochrome ? monoColor : currentPaletteColors[rows.length % currentPaletteColors.length];
                setRows([...rows, { label: "", pct: "", color: nextColor }]);
            };

            // Mozgatott szövegek alaphelyzetbe állítása
            const resetLabelPositions = () => {
                setRows(rows.map(r => {
                    const { customNormX, customNormY, ...rest } = r;
                    return rest;
                }));
            };

            // Geometria kiszámítása
            const getDimensions = useCallback(() => {
                if (isCustomRes) {
                    const cw = Math.max(200, parseInt(customWidth, 10) || 720);
                    const ch = Math.max(200, parseInt(customHeight, 10) || 480);
                    const maxBase = 720;
                    const scaleFactor = maxBase / Math.max(cw, ch);
                    return { width: Math.round(cw * scaleFactor), height: Math.round(ch * scaleFactor), realW: cw, realH: ch };
                }

                let width = 720, height = 405;
                if (aspectRatio === "16:9") { width = 720; height = 405; }
                else if (aspectRatio === "4:3") { width = 640; height = 480; }
                else if (aspectRatio === "21:9") { width = 840; height = 360; }
                else if (aspectRatio === "1:1") { width = 560; height = 560; }
                else if (aspectRatio === "9:16") { width = 405; height = 720; }
                else if (aspectRatio === "4:5") { width = 480; height = 600; }
                else if (aspectRatio === "3:4") { width = 480; height = 640; }
                return { width, height, realW: width, realH: height };
            }, [aspectRatio, isCustomRes, customWidth, customHeight]);

            const draw = useCallback((scaleMultiplier = 2, exactSize = null) => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext("2d");
                
                const dims = getDimensions();
                const baseW = dims.width;
                const baseH = dims.height;

                let finalW, finalH, scaleFactor;
                if (exactSize) {
                    finalW = exactSize.w;
                    finalH = exactSize.h;
                    scaleFactor = finalW / baseW;
                } else {
                    finalW = baseW * scaleMultiplier;
                    finalH = baseH * scaleMultiplier;
                    scaleFactor = scaleMultiplier;
                }

                canvas.width = finalW;
                canvas.height = finalH;
                ctx.scale(scaleFactor, scaleFactor);
                ctx.clearRect(0, 0, baseW, baseH);
                
                let bgStyle = "transparent";
                if (downloadMode === "white") bgStyle = "#ffffff";
                else if (downloadMode === "dark") bgStyle = "#12141a";

                if (bgStyle !== "transparent") {
                    ctx.fillStyle = bgStyle;
                    ctx.fillRect(0, 0, baseW, baseH);
                }

                // Hit-boxok törlése és újraépítése a drag and drop mozgathatósághoz
                labelBoxesRef.current = [];

                const valid = rows.filter(r => r.label && r.pct !== "");
                if (!valid.length) return;

                const pcts = valid.map(r => parseFloat(r.pct) || 0);
                const maxV = Math.max(...pcts, 10);
                const total = pcts.reduce((a, b) => a + b, 0);
                const norm = total > 0 ? pcts.map(p => p / total) : pcts.map(() => 1 / valid.length);
                const colors = valid.map(r => isMonochrome ? monoColor : r.color);
                const labelText = (v) => showPct ? `${v}%` : v;
                
                const textColor = (bgStyle === "#ffffff" || (bgStyle === "transparent" && !isDarkMode)) ? "#18181b" : "#f4f4f5";

                // Biztonságos szövegkiírás: észleli az érintési dobozt a fogáshoz
                const renderClampedText = (text, x, y, maxWidth, lineHeight, align = "center", rowIndex = 0) => {
                    const pad = 16;
                    ctx.textAlign = align;
                    const words = String(text).split(' ');
                    let line = '';
                    const lines = [];
                    for (let n = 0; n < words.length; n++) {
                        let testLine = line + words[n] + ' ';
                        if (ctx.measureText(testLine).width > maxWidth && n > 0) {
                            lines.push(line.trim());
                            line = words[n] + ' ';
                        } else { line = testLine; }
                    }
                    lines.push(line.trim());
                    
                    let minBoxX = Infinity, maxBoxX = -Infinity;
                    let minBoxY = y - 14, maxBoxY = y + (lines.length * lineHeight);

                    lines.forEach((l, idx) => {
                        const lw = ctx.measureText(l).width;
                        let lx = x;
                        if (align === "left") {
                            if (lx + lw > baseW - pad) lx = baseW - pad - lw;
                            if (lx < pad) lx = pad;
                        } else if (align === "right") {
                            if (lx - lw < pad) lx = pad + lw;
                            if (lx > baseW - pad) lx = baseW - pad;
                        } else {
                            if (lx - lw / 2 < pad) lx = pad + lw / 2;
                            if (lx + lw / 2 > baseW - pad) lx = baseW - pad - lw / 2;
                        }
                        let ly = y + (idx * lineHeight);
                        if (ly < 20) ly = 20;
                        if (ly > baseH - 20) ly = baseH - 20;

                        const curMinX = align === "left" ? lx : (align === "right" ? lx - lw : lx - lw/2);
                        const curMaxX = align === "left" ? lx + lw : (align === "right" ? lx : lx + lw/2);
                        if (curMinX < minBoxX) minBoxX = curMinX;
                        if (curMaxX > maxBoxX) maxBoxX = curMaxX;

                        ctx.fillText(l, lx, ly);
                    });

                    // Címke doboz regisztrálása a húzáshoz
                    labelBoxesRef.current.push({
                        index: rowIndex,
                        minX: minBoxX - 8,
                        maxX: maxBoxX + 8,
                        minY: minBoxY - 8,
                        maxY: maxBoxY + 8
                    });
                };

                ctx.font = "600 14px 'Plus Jakarta Sans', sans-serif";

                // 1. Fánk és Torta
                if (chartType === "donut" || chartType === "pie") {
                    const isPortrait = baseW < baseH;
                    const cx = baseW / 2;
                    const cy = isPortrait ? (baseH * 0.42) : (baseH / 2);
                    const r = Math.min(baseW, baseH) * (isPortrait ? 0.22 : 0.28);
                    const pad = 16;

                    let angle = -Math.PI / 2;
                    norm.forEach((frac, i) => {
                        const sweep = frac * 2 * Math.PI;
                        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, angle, angle + sweep);
                        ctx.fillStyle = colors[i]; ctx.fill();
                        if (bgStyle !== "transparent") {
                            ctx.strokeStyle = bgStyle; ctx.lineWidth = 3; ctx.stroke();
                        } else {
                            ctx.strokeStyle = "rgba(255,255,255,0.8)"; ctx.lineWidth = 2; ctx.stroke();
                        }

                        const mid = angle + sweep / 2;
                        const cosM = Math.cos(mid);
                        const sinM = Math.sin(mid);

                        const labelStr = `${valid[i].label} (${labelText(pcts[i])})`;
                        const fullTw = ctx.measureText(labelStr).width;

                        // Ha a felhasználó kézzel elmozgatta, oda rajzoljuk ahova húzta!
                        if (valid[i].customNormX != null && valid[i].customNormY != null) {
                            ctx.fillStyle = colors[i];
                            renderClampedText(labelStr, valid[i].customNormX * baseW, valid[i].customNormY * baseH, Math.min(220, baseW - pad * 2), 16, "center", i);
                        } else {
                            // Automatikus pozíció
                            const stdDist = r + 38;
                            const stdLx = cx + cosM * stdDist;
                            const stdLy = cy + sinM * stdDist;
                            const isRight = cosM >= 0;

                            const estMinX = isRight ? stdLx : stdLx - fullTw;
                            const estMaxX = isRight ? stdLx + fullTw : stdLx;

                            const clips = (estMinX < pad || estMaxX > baseW - pad);

                            if (clips) {
                                const isTop = sinM < 0;
                                const targetY = isTop ? (cy - r - 26) : (cy + r + 36);
                                const targetX = cx + cosM * (r * 0.45);

                                ctx.fillStyle = colors[i];
                                renderClampedText(labelStr, targetX, targetY, Math.min(200, baseW - pad * 2), 16, "center", i);
                            } else {
                                ctx.fillStyle = colors[i];
                                renderClampedText(labelStr, stdLx, stdLy, Math.min(150, baseW * 0.32), 16, isRight ? "left" : "right", i);
                            }
                        }

                        angle += sweep;
                    });

                    if (chartType === "donut") {
                        if (bgStyle === "transparent") {
                            ctx.globalCompositeOperation = 'destination-out';
                            ctx.beginPath(); ctx.arc(cx, cy, r * 0.6, 0, 2 * Math.PI);
                            ctx.fillStyle = "rgba(0,0,0,1)"; ctx.fill();
                            ctx.globalCompositeOperation = 'source-over';
                        } else {
                            ctx.beginPath(); ctx.arc(cx, cy, r * 0.6, 0, 2 * Math.PI);
                            ctx.fillStyle = bgStyle; ctx.fill();
                        }
                    }
                }
                // 2. Oszlopdiagram
                else if (chartType === "bar") {
                    const aW = baseW * 0.78, aH = baseH * 0.52;
                    const sp = aW / Math.max(valid.length, 1);
                    const bW = Math.min(sp * 0.7, 60);
                    const startX = (baseW - (valid.length * sp)) / 2;
                    valid.forEach((row, i) => {
                        const bh = (pcts[i] / maxV) * aH;
                        const bx = startX + i * sp + (sp - bW) / 2;
                        const by = baseH - (baseH * 0.22) - bh;
                        ctx.fillStyle = colors[i]; ctx.beginPath(); ctx.roundRect(bx, by, bW, bh, [8, 8, 0, 0]); ctx.fill();
                        
                        ctx.textAlign = "center"; ctx.fillStyle = textColor; 
                        ctx.fillText(labelText(pcts[i]), bx + bW/2, by - 10);

                        ctx.font = "500 12px 'Plus Jakarta Sans'"; 
                        ctx.fillStyle = colors[i];
                        if (row.customNormX != null && row.customNormY != null) {
                            renderClampedText(row.label, row.customNormX * baseW, row.customNormY * baseH, sp * 1.5, 14, "center", i);
                        } else {
                            renderClampedText(row.label, bx + bW/2, baseH - (baseH * 0.17), sp * 0.95, 14, "center", i);
                        }
                        ctx.font = "600 12px 'Plus Jakarta Sans'";
                    });
                }
                // 3. Sávdiagram (Vízszintes)
                else if (chartType === "hbar") {
                    const PL = Math.max(100, baseW * 0.24), PR = Math.max(60, baseW * 0.16);
                    const aW = baseW - PL - PR;
                    const rowH = Math.min(50, (baseH - 80) / Math.max(valid.length, 1));
                    const startY = (baseH - (valid.length * rowH)) / 2;
                    valid.forEach((row, i) => {
                        const bw = (pcts[i] / maxV) * aW, bH = Math.min(30, rowH * 0.65), by = startY + i * rowH + (rowH - bH) / 2;
                        ctx.fillStyle = isDarkMode ? "#27272a" : "#f4f4f5"; ctx.beginPath(); ctx.roundRect(PL, by, aW, bH, 8); ctx.fill();
                        ctx.fillStyle = colors[i]; ctx.beginPath(); ctx.roundRect(PL, by, bw, bH, 8); ctx.fill();
                        
                        ctx.fillStyle = colors[i];
                        if (row.customNormX != null && row.customNormY != null) {
                            renderClampedText(row.label, row.customNormX * baseW, row.customNormY * baseH, PL, 14, "center", i);
                        } else {
                            renderClampedText(row.label, PL - 15, by + bH/2 + 5, PL - 25, 14, "right", i);
                        }

                        ctx.textAlign = "left"; 
                        ctx.fillStyle = textColor;
                        ctx.fillText(labelText(pcts[i]), PL + bw + 15, by + bH/2 + 5);
                    });
                }
                // 4. Vonal és Pont
                else if (chartType === "line" || chartType === "scatter") {
                    const PL = Math.max(60, baseW * 0.12), PR = Math.max(60, baseW * 0.12);
                    const PT = Math.max(60, baseH * 0.15), PB = Math.max(70, baseH * 0.18);
                    const aW = baseW - PL - PR, aH = baseH - PT - PB;
                    const step = valid.length > 1 ? aW / (valid.length - 1) : 0;
                    const startX = valid.length > 1 ? PL : baseW / 2;
                    const ys = pcts.map(p => baseH - PB - (p / maxV) * aH);
                    
                    if (chartType === "line") {
                        ctx.beginPath(); ctx.moveTo(startX, ys[0]); valid.forEach((_, i) => ctx.lineTo(startX + i * step, ys[i]));
                        ctx.strokeStyle = colors[0]; ctx.lineWidth = 4; ctx.stroke();
                    }
                    valid.forEach((row, i) => {
                        const x = startX + i * step, y = ys[i];
                        ctx.beginPath(); ctx.arc(x, y, chartType === "scatter" ? 12 : 6, 0, Math.PI * 2);
                        ctx.fillStyle = chartType === "scatter" ? colors[i] : (bgStyle === "transparent" ? (isDarkMode ? "#12141a" : "#fff") : bgStyle);
                        ctx.fill(); ctx.strokeStyle = colors[i]; ctx.lineWidth = 3; ctx.stroke();
                        
                        ctx.textAlign = "center"; ctx.fillStyle = textColor; 
                        ctx.fillText(labelText(pcts[i]), x, y - 16);

                        ctx.font = "500 11px 'Plus Jakarta Sans'"; 
                        ctx.fillStyle = colors[i];
                        if (row.customNormX != null && row.customNormY != null) {
                            renderClampedText(row.label, row.customNormX * baseW, row.customNormY * baseH, Math.max(80, (aW/valid.length)*1.2), 13, "center", i);
                        } else {
                            renderClampedText(row.label, x, baseH - PB + 26, Math.max(80, (aW/valid.length)*0.9), 13, "center", i);
                        }
                        ctx.font = "600 11px 'Plus Jakarta Sans'";
                    });
                }

                // Mintanagyság (n = ...)
                if (showN && n) {
                    ctx.font = "italic 500 15px 'JetBrains Mono'"; ctx.fillStyle = isDarkMode ? "#a1a1aa" : "#71717a";
                    const txt = `n = ${n}`, tw = ctx.measureText(txt).width;
                    let nx = Math.max(25, baseW * 0.05);
                    let ny = Math.max(30, baseH * 0.07);
                    let pos = nPos.toLowerCase();
                    if (pos === "jf" || pos === "tr") nx = baseW - tw - Math.max(25, baseW * 0.05);
                    else if (pos === "ba" || pos === "bl") ny = baseH - Math.max(25, baseH * 0.05);
                    else if (pos === "ja" || pos === "br") { 
                        nx = baseW - tw - Math.max(25, baseW * 0.05); 
                        ny = baseH - Math.max(25, baseH * 0.05); 
                    }
                    if (nx + tw > baseW - 16) nx = baseW - tw - 16;
                    if (nx < 16) nx = 16;
                    if (ny > baseH - 16) ny = baseH - 16;
                    if (ny < 25) ny = 25;
                    ctx.textAlign = "left"; ctx.fillText(txt, nx, ny);
                }
            }, [rows, chartType, n, nPos, showN, showPct, isDarkMode, downloadMode, isMonochrome, monoColor, lang, getDimensions]);

            useEffect(() => {
                draw(2);
            }, [draw]);

            // --- DRAG AND DROP MOZGATÁS VEZÉRLÉS ---
            const getCanvasCoords = (clientX, clientY) => {
                const canvas = canvasRef.current;
                if (!canvas) return { x: 0, y: 0 };
                const rect = canvas.getBoundingClientRect();
                const dims = getDimensions();
                const scaleX = dims.width / rect.width;
                const scaleY = dims.height / rect.height;
                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const handleDragStart = (clientX, clientY) => {
                const coords = getCanvasCoords(clientX, clientY);
                const hit = labelBoxesRef.current.find(b => 
                    coords.x >= b.minX && coords.x <= b.maxX && coords.y >= b.minY && coords.y <= b.maxY
                );
                if (hit !== undefined) {
                    draggingIndexRef.current = hit.index;
                    if (canvasRef.current) canvasRef.current.style.cursor = 'grabbing';
                }
            };

            const handleDragMove = (clientX, clientY) => {
                const coords = getCanvasCoords(clientX, clientY);
                if (draggingIndexRef.current !== null) {
                    const idx = draggingIndexRef.current;
                    const dims = getDimensions();
                    const normX = Math.max(0.06, Math.min(0.94, coords.x / dims.width));
                    const normY = Math.max(0.06, Math.min(0.94, coords.y / dims.height));
                    setRows(prev => prev.map((r, i) => i === idx ? { ...r, customNormX: normX, customNormY: normY } : r));
                } else {
                    const isOver = labelBoxesRef.current.some(b => 
                        coords.x >= b.minX && coords.x <= b.maxX && coords.y >= b.minY && coords.y <= b.maxY
                    );
                    if (canvasRef.current) {
                        canvasRef.current.style.cursor = isOver ? 'grab' : 'default';
                    }
                }
            };

            const handleDragEnd = () => {
                draggingIndexRef.current = null;
                if (canvasRef.current) canvasRef.current.style.cursor = 'default';
            };

            const handleDownload = () => {
                if (isCustomRes) {
                    const rw = parseInt(customWidth, 10) || 1920;
                    const rh = parseInt(customHeight, 10) || 1080;
                    draw(1, { w: rw, h: rh });
                } else {
                    draw(exportScale);
                }

                setTimeout(() => {
                    const link = document.createElement("a");
                    const qualityTag = isCustomRes ? `${customWidth}x${customHeight}` : (exportScale === 2 ? 'HD' : (exportScale === 3 ? 'UHD' : (exportScale === 4 ? '4K' : 'SD')));
                    link.download = `diagram_${aspectRatio.replace(':', 'x')}_${qualityTag}.png`;
                    link.href = canvasRef.current.toDataURL("image/png", 1.0);
                    link.click();
                    draw(2);
                }, 60);
            };

            // Dinamikus gomb szöveg (HD, UHD, 4K)
            const getDownloadButtonLabel = () => {
                if (isCustomRes) {
                    return `PNG ${t.btnDownloadBase} (${customWidth}×${customHeight}px)`;
                }
                let qualLabel = "HD";
                if (exportScale === 1) qualLabel = "SD";
                else if (exportScale === 2) qualLabel = "HD";
                else if (exportScale === 3) qualLabel = "UHD";
                else if (exportScale === 4) qualLabel = "4K";

                return `${qualLabel} PNG ${t.btnDownloadBase} (${aspectRatio})`;
            };

            const hasCustomMovedLabels = rows.some(r => r.customNormX != null);
            const inputClasses = "w-full ios-input rounded-xl py-2 px-3 text-sm font-medium focus:outline-none";

            return (
                <div id="app-container" className="flex flex-col min-h-screen">
                    <div className="absolute inset-0 overflow-hidden pointer-events-none -z-10">
                        <div className="absolute -top-16 -left-16 w-[560px] h-[560px] bg-indigo-600/25 rounded-full blur-[140px]"></div>
                        <div className="absolute top-[650px] -right-24 w-[520px] h-[520px] bg-violet-600/20 rounded-full blur-[150px]"></div>
                        <div className="absolute -bottom-16 -left-16 w-[600px] h-[600px] bg-indigo-800/20 rounded-full blur-[140px]"></div>
                    </div>

                    {/* Fejléc - Letisztult, alcím nélkül */}
                    <header className="sticky top-0 z-30 bg-[#09090b]/40 backdrop-blur-2xl border-b border-white/10 shrink-0">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-3">
                            <div className="flex items-center gap-3.5">
                                <div className="w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-indigo-400 shadow-inner backdrop-blur-md shrink-0">
                                    <Icons.Chart />
                                </div>
                                <div>
                                    <div className="flex flex-wrap items-center gap-2">
                                        <h1 className="text-sm sm:text-base font-bold tracking-tight text-white leading-tight">
                                            {t.title}
                                        </h1>
                                        <span className="text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-indigo-500/15 text-indigo-300 border border-indigo-400/25">
                                            {t.creator}
                                        </span>
                                    </div>
                                </div>
                            </div>

                            <div className="flex items-center gap-2.5">
                                <a href="https://nagymarton06.github.io/Homepage/" className="p-2.5 rounded-xl border border-white/10 bg-white/5 text-zinc-300 hover:bg-white/10 hover:text-indigo-400 transition-colors shadow-sm flex items-center justify-center backdrop-blur-md" aria-label="Főoldal" title="Főoldal">
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                                    </svg>
                                </a>

                                <div className="inline-flex rounded-xl p-1 bg-white/5 border border-white/10 backdrop-blur-lg">
                                    <button onClick={() => toggleLang()} className={`px-2.5 py-1 text-xs font-semibold rounded-lg transition-all ${lang === 'hu' ? 'bg-indigo-500/25 border border-indigo-500/30 text-indigo-300 shadow-sm' : 'text-zinc-400 hover:text-zinc-200'}`}>
                                        HU
                                    </button>
                                    <button onClick={() => toggleLang()} className={`px-2.5 py-1 text-xs font-semibold rounded-lg transition-all ${lang === 'en' ? 'bg-indigo-500/25 border border-indigo-500/30 text-indigo-300 shadow-sm' : 'text-zinc-400 hover:text-zinc-200'}`}>
                                        EN
                                    </button>
                                </div>

                                <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2.5 rounded-xl border border-white/10 bg-white/5 text-zinc-300 hover:bg-white/10 hover:text-indigo-400 transition-colors shadow-sm backdrop-blur-md">
                                    {isDarkMode ? <Icons.Sun /> : <Icons.Moon />}
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 relative flex-grow">
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8 items-start">
                            
                            {/* BAL OLDAL - VEZÉRLŐK */}
                            <div className="lg:col-span-5 space-y-6">
                                <section className="ios-glass rounded-3xl p-5 sm:p-6 space-y-5">
                                    
                                    <SectionHeader icon={<Icons.Layers />} title={t.sec1} />
                                    <div className="grid grid-cols-3 gap-2">
                                        {CHART_TYPES(lang).map(ti => (
                                            <button key={ti.id} onClick={() => setChartType(ti.id)} 
                                                className={`py-2 px-2 rounded-xl font-semibold text-xs transition-all border ${chartType === ti.id ? "bg-indigo-600/30 border-indigo-500/60 text-white shadow-inner" : "bg-white/[0.03] border-white/10 text-zinc-400 hover:bg-white/[0.07] hover:text-zinc-200"}`}>
                                                {ti.icon} {ti.label}
                                            </button>
                                        ))}
                                    </div>

                                    <SectionHeader icon={<Icons.Palette />} title={t.sec2} />
                                    <div className="grid grid-cols-3 gap-2">
                                        {PALETTES(lang).map((p, i) => (
                                            <button key={i} onClick={() => applyPalette(p)} className="p-2.5 rounded-xl bg-white/[0.03] border border-white/10 flex flex-col gap-1.5 items-center hover:bg-white/[0.07] hover:border-indigo-500/40 transition-colors">
                                                <div className="flex gap-1">
                                                    {p.colors.slice(0, 4).map((c, ci) => <div key={ci} className="w-2 h-2 rounded-full" style={{background: c}} />)}
                                                </div>
                                                <span className="text-[10px] font-bold text-zinc-300">{p.name}</span>
                                            </button>
                                        ))}
                                    </div>

                                    <SectionHeader icon={<Icons.Settings />} title={t.sec3} />
                                    <div className="flex justify-between items-center bg-white/[0.03] px-4 py-3 rounded-xl border border-white/10">
                                        <span className="text-sm font-semibold text-zinc-200">{t.mono}</span>
                                        <div className="flex items-center gap-3">
                                            {isMonochrome && (
                                                <div className="w-6 h-6 rounded-md color-picker-wrapper shadow-sm border border-white/20" style={{background: monoColor}}>
                                                    <input type="color" value={monoColor} onChange={e => setMonoColor(e.target.value)} />
                                                </div>
                                            )}
                                            <Toggle value={isMonochrome} onChange={setIsMonochrome} />
                                        </div>
                                    </div>

                                    <div className="space-y-3">
                                        {rows.map((r, i) => (
                                            <div key={i} className="flex gap-2 items-center">
                                                {!isMonochrome ? (
                                                    <div className="w-9 h-9 rounded-xl color-picker-wrapper shadow-sm border border-white/20 shrink-0" style={{background: r.color}}>
                                                        <input type="color" value={r.color} onChange={(e) => {
                                                            const nr = [...rows]; nr[i].color = e.target.value; setRows(nr);
                                                        }} />
                                                    </div>
                                                ) : (
                                                    <div className="w-9 h-9 rounded-xl shadow-sm opacity-90 shrink-0 border border-white/10" style={{background: monoColor}}></div>
                                                )}
                                                <input className={inputClasses} value={r.label} onChange={(e) => {
                                                    const nr = [...rows]; nr[i].label = e.target.value; setRows(nr);
                                                }} placeholder={t.placeholderName} />
                                                <div className="relative w-20 shrink-0">
                                                    <input className={`${inputClasses} pr-7 text-right ${validatorError ? "text-rose-400 border-rose-500/60" : "font-mono"}`} value={r.pct} onChange={(e) => {
                                                        const nr = [...rows]; nr[i].pct = e.target.value; setRows(nr);
                                                    }} />
                                                    <span className="absolute right-2.5 top-2 text-xs font-bold text-zinc-500 pointer-events-none">{showPct ? "%" : "x"}</span>
                                                </div>
                                                <button onClick={() => setRows(rows.filter((_, idx) => idx !== i))} className="p-2 text-zinc-500 hover:text-rose-400 transition-colors"><Icons.Trash /></button>
                                            </div>
                                        ))}
                                    </div>

                                    {totalSum > 0 && (
                                        <div className={`p-3 rounded-xl border flex items-center justify-between ${validatorError ? "bg-rose-500/10 border-rose-500/30 text-rose-300" : "bg-indigo-500/10 border-indigo-500/30 text-indigo-300"}`}>
                                            <span className="text-xs font-semibold">
                                                {validatorError ? (showPct ? t.warning100 : t.warningN) : (showPct ? t.total : t.totalN)}
                                            </span>
                                            <span className="text-sm font-bold font-mono">
                                                {showPct ? `${totalSum.toFixed(1)}%` : `${totalSum} / ${targetN}`}
                                            </span>
                                        </div>
                                    )}

                                    <div className="flex flex-wrap gap-2">
                                        {!isMonochrome && <button onClick={reverseColors} className="flex-1 py-2.5 rounded-xl bg-white/[0.04] text-zinc-300 font-semibold text-xs border border-white/10 hover:bg-white/[0.08] transition-colors">{t.btnReverse}</button>}
                                        <button onClick={addNewRow} className="flex-[2] py-2.5 rounded-xl border border-dashed border-indigo-500/40 text-indigo-400 font-bold text-xs hover:bg-indigo-500/10 transition-colors">{t.btnAdd}</button>
                                        {hasCustomMovedLabels && (
                                            <button onClick={resetLabelPositions} className="w-full py-2 rounded-xl bg-white/[0.02] text-zinc-400 hover:text-zinc-200 font-medium text-xs border border-white/5 hover:border-white/10 transition-colors flex items-center justify-center gap-1.5">
                                                {t.btnResetPos}
                                            </button>
                                        )}
                                    </div>

                                    <SectionHeader icon={<Icons.Download />} title={t.sec4} />
                                    <div className="space-y-4 bg-white/[0.03] p-4 rounded-xl border border-white/10">
                                        <div className="flex justify-between items-center">
                                            <span className="text-sm font-semibold text-zinc-300">{t.showPct}</span>
                                            <Toggle value={showPct} onChange={setShowPct} />
                                        </div>
                                        <div className="flex justify-between items-center">
                                            <span className="text-sm font-semibold text-zinc-300">{t.showN}</span>
                                            <Toggle value={showN} onChange={setShowN} />
                                        </div>
                                        {showN && (
                                            <div className="pt-2 border-t border-white/10">
                                                <input className={`${inputClasses} mb-2`} type="text" value={n} onChange={(e) => setN(e.target.value)} placeholder={t.placeholderN} />
                                                <div className="grid grid-cols-4 gap-1.5 p-1 rounded-xl bg-black/30 border border-white/10">
                                                    {(lang === 'hu' ? [['bf', 'BF'],['jf', 'JF'],['ba', 'BA'],['ja', 'JA']] : [['tl', 'TL'],['tr', 'TR'],['bl', 'BL'],['br', 'BR']]).map(([p, l]) => (
                                                        <button key={p} onClick={() => setNPos(p)} className={`py-1.5 text-[11px] font-bold rounded-lg transition-all ${nPos === p ? "bg-indigo-500/25 border border-indigo-500/30 text-indigo-300 shadow-sm" : "text-zinc-400 hover:text-white"}`}>{l}</button>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        {/* KÉPARÁNY: EMOJIK NÉLKÜL, TISZTA 2 LÉPCSŐS FÜLEKKEL */}
                                        <div className="pt-3 border-t border-white/10">
                                            <span className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-2 block">{t.aspectRatioLabel}</span>
                                            
                                            {/* 1. Lépcső: Fő kategóriák (Emojik nélkül) */}
                                            <div className="grid grid-cols-3 gap-1.5 p-1 rounded-xl bg-black/30 border border-white/10 mb-2">
                                                <button onClick={() => { setAspectGroup("landscape"); setAspectRatio("16:9"); setIsCustomRes(false); }} className={`py-2 text-xs font-bold rounded-lg transition-all ${aspectGroup === "landscape" && !isCustomRes ? "bg-indigo-500/25 border border-indigo-500/30 text-indigo-300 shadow-sm" : "text-zinc-400 hover:text-white"}`}>
                                                    {t.modeLandscape}
                                                </button>
                                                <button onClick={() => { setAspectGroup("portrait"); setAspectRatio("9:16"); setIsCustomRes(false); }} className={`py-2 text-xs font-bold rounded-lg transition-all ${aspectGroup === "portrait" && !isCustomRes ? "bg-indigo-500/25 border border-indigo-500/30 text-indigo-300 shadow-sm" : "text-zinc-400 hover:text-white"}`}>
                                                    {t.modePortrait}
                                                </button>
                                                <button onClick={() => { setAspectGroup("square"); setAspectRatio("1:1"); setIsCustomRes(false); }} className={`py-2 text-xs font-bold rounded-lg transition-all ${aspectGroup === "square" && !isCustomRes ? "bg-indigo-500/25 border border-indigo-500/30 text-indigo-300 shadow-sm" : "text-zinc-400 hover:text-white"}`}>
                                                    {t.modeSquare}
                                                </button>
                                            </div>

                                            {/* 2. Lépcső: Kategória almenü */}
                                            {aspectGroup === "landscape" && !isCustomRes && (
                                                <div className="grid grid-cols-3 gap-1.5 p-1 rounded-xl bg-white/[0.02] border border-white/5">
                                                    {[["16:9", "16:9 (Alap)"], ["4:3", "4:3"], ["21:9", "21:9"]].map(([r, lbl]) => (
                                                        <button key={r} onClick={() => setAspectRatio(r)} className={`py-1.5 text-[11px] font-bold rounded-lg transition-all ${aspectRatio === r ? "bg-indigo-600/30 text-indigo-200 border border-indigo-500/40" : "text-zinc-400 hover:text-white"}`}>{lbl}</button>
                                                    ))}
                                                </div>
                                            )}

                                            {aspectGroup === "portrait" && !isCustomRes && (
                                                <div className="grid grid-cols-3 gap-1.5 p-1 rounded-xl bg-white/[0.02] border border-white/5">
                                                    {[["9:16", "9:16 Story"], ["4:5", "4:5 Insta"], ["3:4", "3:4 Portré"]].map(([r, lbl]) => (
                                                        <button key={r} onClick={() => setAspectRatio(r)} className={`py-1.5 text-[11px] font-bold rounded-lg transition-all ${aspectRatio === r ? "bg-indigo-600/30 text-indigo-200 border border-indigo-500/40" : "text-zinc-400 hover:text-white"}`}>{lbl}</button>
                                                    ))}
                                                </div>
                                            )}
                                        </div>

                                        {/* FELBONTÁS (MINŐSÉG) - HD az alapértelmezett */}
                                        <div className="pt-3 border-t border-white/10">
                                            <div className="flex justify-between items-center mb-2">
                                                <span className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">{t.resolutionLabel}</span>
                                                <button onClick={() => setIsCustomRes(!isCustomRes)} className={`text-[11px] font-bold px-2 py-0.5 rounded-md transition-colors ${isCustomRes ? 'bg-indigo-500/30 text-indigo-300 border border-indigo-500/40' : 'text-zinc-400 hover:text-zinc-200'}`}>
                                                    {t.customResLabel}
                                                </button>
                                            </div>

                                            {!isCustomRes ? (
                                                <div className="grid grid-cols-4 gap-1.5 p-1 rounded-xl bg-black/30 border border-white/10">
                                                    {[[1, "1x SD"], [2, "2x HD"], [3, "3x UHD"], [4, "4x 4K"]].map(([sc, lbl]) => (
                                                        <button key={sc} onClick={() => setExportScale(sc)} className={`py-1.5 text-[11px] font-bold rounded-lg transition-all ${exportScale === sc ? "bg-indigo-500/25 border border-indigo-500/30 text-indigo-300 shadow-sm" : "text-zinc-400 hover:text-white"}`}>{lbl}</button>
                                                    ))}
                                                </div>
                                            ) : (
                                                <div className="grid grid-cols-2 gap-2 p-2 rounded-xl bg-black/30 border border-white/10">
                                                    <div>
                                                        <span className="text-[10px] text-zinc-500 block mb-1">Szélesség (px)</span>
                                                        <input type="number" min="100" max="8000" className={inputClasses} value={customWidth} onChange={(e) => setCustomWidth(e.target.value)} placeholder="1920" />
                                                    </div>
                                                    <div>
                                                        <span className="text-[10px] text-zinc-500 block mb-1">Magasság (px)</span>
                                                        <input type="number" min="100" max="8000" className={inputClasses} value={customHeight} onChange={(e) => setCustomHeight(e.target.value)} placeholder="1080" />
                                                    </div>
                                                </div>
                                            )}
                                        </div>

                                        <div className="pt-3 border-t border-white/10">
                                            <span className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-2 block">{t.saveBg}</span>
                                            <div className="flex gap-1.5 p-1 rounded-xl bg-black/30 border border-white/10">
                                                {[["white", t.bgWhite], ["dark", t.bgDark], ["transparent", t.bgNone]].map(([m, l]) => (
                                                    <button key={m} onClick={() => setDownloadMode(m)} className={`flex-1 py-1.5 text-[11px] font-bold rounded-lg transition-all ${downloadMode === m ? "bg-indigo-500/25 border border-indigo-500/30 text-indigo-300 shadow-sm" : "text-zinc-400 hover:text-white"}`}>{l}</button>
                                                ))}
                                            </div>
                                        </div>
                                    </div>

                                    {/* DINAMIKUS LETÖLTŐ GOMB: HD / UHD / 4K */}
                                    <button onClick={handleDownload} className="w-full py-3.5 rounded-xl btn-indigo-glass text-indigo-200 font-bold text-sm shadow-md transition-all flex justify-center items-center gap-2">
                                        <Icons.Download /> {getDownloadButtonLabel()}
                                    </button>
                                </section>
                            </div>

                            {/* JOBB OLDAL - RAGADÓS CANVAS + MOZGATÁSI INTERAKCIÓ */}
                            <div className="lg:col-span-7 space-y-3 order-first lg:order-last lg:sticky lg:top-24 z-10">
                                <section className={`ios-glass rounded-3xl p-3 sm:p-5 flex items-center justify-center min-h-[420px] transition-all overflow-hidden ${downloadMode === 'white' ? 'bg-white/95' : (downloadMode === 'dark' ? 'bg-[#12141a]/90' : 'bg-white/[0.02] border-dashed border-white/15')}`}>
                                    <canvas 
                                        ref={canvasRef} 
                                        onMouseDown={(e) => handleDragStart(e.clientX, e.clientY)}
                                        onMouseMove={(e) => handleDragMove(e.clientX, e.clientY)}
                                        onMouseUp={handleDragEnd}
                                        onMouseLeave={handleDragEnd}
                                        onTouchStart={(e) => {
                                            if (e.touches && e.touches[0]) handleDragStart(e.touches[0].clientX, e.touches[0].clientY);
                                        }}
                                        onTouchMove={(e) => {
                                            if (e.touches && e.touches[0]) handleDragMove(e.touches[0].clientX, e.touches[0].clientY);
                                        }}
                                        onTouchEnd={handleDragEnd}
                                        className="max-w-full h-auto drop-shadow-sm rounded-lg select-none" 
                                    />
                                </section>
                                <p className="text-[11px] text-zinc-500 text-center flex items-center justify-center gap-1.5">
                                    <Icons.Move /> {t.dragHint}
                                </p>
                            </div>

                        </div>
                    </main>

                    <footer className="p-4 sm:p-5 text-center text-xs text-zinc-500 border-t border-white/10 bg-[#09090b]/40 backdrop-blur-xl mt-6 shrink-0">
                        <span>© 2026 Nagy Márton. Minden jog fenntartva.</span>
                    </footer>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
