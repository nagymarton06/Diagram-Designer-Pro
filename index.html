<!DOCTYPE html>
<html lang="hu" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagramtervező — Készítette: Nagy Márton</title>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS & Config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        .card-surface { transition: box-shadow 0.2s ease, border-color 0.2s ease; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        .dark ::-webkit-scrollbar-track { background: #121316; }
        .dark ::-webkit-scrollbar-thumb { background: #2e3038; border-radius: 4px; }
        html:not(.dark) ::-webkit-scrollbar-track { background: #f4f4f5; }
        html:not(.dark) ::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 4px; }
        
        .color-picker-wrapper { position: relative; overflow: hidden; cursor: pointer; flex-shrink: 0; }
        .color-picker-wrapper input[type="color"] { position: absolute; top: -10px; left: -10px; width: 60px; height: 60px; cursor: pointer; opacity: 0; }
    </style>
</head>
<body class="bg-[#f4f4f0] text-zinc-900 dark:bg-[#0c0d10] dark:text-zinc-100 min-h-screen font-sans antialiased transition-colors duration-200 selection:bg-indigo-600 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useCallback } = React;

        // --- ICONS ---
        const Icons = {
            Chart: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M10.5 6a7.5 7.5 0 107.5 7.5h-7.5V6z"></path><path strokeLinecap="round" strokeLinejoin="round" d="M13.5 10.5H21A7.5 7.5 0 0013.5 3v7.5z"></path></svg>,
            Sun: () => <svg className="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>,
            Moon: () => <svg className="w-4 h-4 text-zinc-700" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>,
            Download: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>,
            Trash: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>,
            Layers: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>,
            Palette: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"></path></svg>,
            Settings: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        };

        const i18n = {
            hu: {
                title: "Diagramtervező",
                creator: "Készítette: Nagy Márton",
                subtitle: "Precíziós vizualizációs eszköz egyedi felbontással és adatelemzéssel",
                sec1: "Diagram Típus",
                sec2: "Gyors Paletták",
                sec3: "Adatok és Színek",
                sec4: "Megjelenítés & Mentés",
                donut: "Fánk", pie: "Torta", bar: "Oszlop", hbar: "Sáv", line: "Vonal", scatter: "Pont",
                mono: "Egyszínű mód (Monokróm)",
                placeholderName: "Név",
                placeholderPct: "%",
                placeholderDb: "db",
                placeholderN: "n = ?",
                total: "Összesen:",
                totalN: "Összes elemszám:",
                warning100: "Túllépted a 100%-ot!",
                warningN: "Túllépted az elemszámot!",
                btnReverse: "⇄ Szín csere",
                btnAdd: "+ Új adatsor",
                showPct: "Százalékjel (%)",
                showN: "Elemszám (n=)",
                saveBg: "MENTÉS HÁTTERE",
                bgWhite: "Fehér", bgDark: "Sötét", bgNone: "Nincs",
                btnDownload: "HD PNG LETÖLTÉSE",
                defLabelA: "Csoport A",
                defLabelB: "Csoport B",
                palModern: "Modern", palRetro: "Retro", palForest: "Erdő", palSun: "Napfény", palDeep: "Mélykék", palPurple: "Lila"
            },
            en: {
                title: "Diagram Designer",
                creator: "Created by: Márton Nagy",
                subtitle: "Precision visualization tool with custom resolution and data tracking",
                sec1: "Chart Type",
                sec2: "Fast Palettes",
                sec3: "Data & Colors",
                sec4: "Display & Save",
                donut: "Donut", pie: "Pie", bar: "Column", hbar: "Bar", line: "Line", scatter: "Scatter",
                mono: "Monochrome Mode",
                placeholderName: "Label",
                placeholderPct: "%",
                placeholderDb: "qty",
                placeholderN: "Sample size n = ?",
                total: "Total:",
                totalN: "Total Count:",
                warning100: "Exceeded 100%!",
                warningN: "Exceeded sample size!",
                btnReverse: "⇄ Reverse",
                btnAdd: "+ Add Row",
                showPct: "Show Percentage (%)",
                showN: "Show Sample Size (n=)",
                saveBg: "EXPORT BACKGROUND",
                bgWhite: "White", bgDark: "Dark", bgNone: "Transparent",
                btnDownload: "DOWNLOAD HD PNG",
                defLabelA: "Group A",
                defLabelB: "Group B",
                palModern: "Modern", palRetro: "Retro", palForest: "Forest", palSun: "Sunshine", palDeep: "Deep Blue", palPurple: "Purple"
            }
        };

        const CHART_TYPES = (lang) => [
            { id: "donut",   label: i18n[lang].donut,      icon: "◎" },
            { id: "pie",     label: i18n[lang].pie,        icon: "⬤" },
            { id: "bar",     label: i18n[lang].bar,        icon: "▐" },
            { id: "hbar",    label: i18n[lang].hbar,       icon: "▬" },
            { id: "line",    label: i18n[lang].line,       icon: "∿" },
            { id: "scatter", label: i18n[lang].scatter,    icon: "⁙" },
        ];

        const PALETTES = (lang) => [
            { name: i18n[lang].palModern, colors: ["#6366f1","#ec4899","#8b5cf6","#3b82f6","#14b8a6","#f59e0b","#f43f5e","#10b981","#84cc16"] },
            { name: i18n[lang].palRetro,  colors: ["#E63946","#457B9D","#1D3557","#F4A261","#2A9D8F","#E9C46A","#264653","#F77F00","#8D99AE"] },
            { name: i18n[lang].palForest, colors: ["#2D6A4F","#40916C","#52B788","#74C69D","#95D5B2","#B7E4C7","#D8F3DC","#1B4332","#004B23"] },
            { name: i18n[lang].palSun,    colors: ["#FFD000","#FFB300","#FFA000","#FF8F00","#FF6F00","#E65100","#FB8C00","#F57C00","#EF6C00"] },
            { name: i18n[lang].palDeep,   colors: ["#03045E","#023E8A","#0077B6","#0096C7","#00B4D8","#48CAE4","#90E0EF","#ADE8F4","#E0F2FE"] },
            { name: i18n[lang].palPurple, colors: ["#4C1D95","#5B21B6","#6D28D9","#7C3AED","#8B5CF6","#A78BFA","#C4B5FD","#DDD6FE","#EDE9FE"] },
        ];

        const SectionHeader = ({ icon, title }) => (
            <div className="flex items-center justify-between border-b border-zinc-100 dark:border-zinc-800/80 pb-3 mb-4 mt-2">
                <div className="flex items-center gap-2.5">
                    <div className="w-7 h-7 rounded-lg bg-indigo-500/10 flex items-center justify-center text-indigo-600 dark:text-indigo-400">
                        {icon}
                    </div>
                    <h2 className="font-bold text-base text-zinc-900 dark:text-zinc-100">{title}</h2>
                </div>
            </div>
        );

        const Toggle = ({value, onChange, isDark}) => (
            <label className="inline-flex items-center cursor-pointer select-none shrink-0">
                <input type="checkbox" className="sr-only peer" checked={value} onChange={(e) => onChange(e.target.checked)} />
                <div className={`w-10 h-5 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-5 peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-zinc-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all relative peer-checked:bg-indigo-600 shadow-inner ${value ? '' : (isDark ? 'bg-[#4B5563]' : 'bg-[#E2E2E9]')}`}></div>
            </label>
        );

        function App() {
            const canvasRef = useRef(null);
            const [isDarkMode, setIsDarkMode] = useState(true);
            const [lang, setLang] = useState("hu");
            const [chartType, setChartType] = useState("donut");
            const [n, setN] = useState("200");
            const [nPos, setNPos] = useState("ja");
            const [showN, setShowN] = useState(true);
            const [showPct, setShowPct] = useState(true);
            const [downloadMode, setDownloadMode] = useState("dark"); 
            const [isMonochrome, setIsMonochrome] = useState(false);
            const [monoColor, setMonoColor] = useState("#6366f1");
            const [rows, setRows] = useState([
                { label: i18n.hu.defLabelA, pct: "70", color: "#6366f1" },
                { label: i18n.hu.defLabelB, pct: "30", color: "#ec4899" }
            ]);

            const t = i18n[lang];

            useEffect(() => {
                if (isDarkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [isDarkMode]);

            const toggleLang = () => {
                const newLang = lang === 'hu' ? 'en' : 'hu';
                const oldT = i18n[lang];
                const newT = i18n[newLang];
                
                const updatedRows = rows.map(r => {
                    if (r.label === oldT.defLabelA) return { ...r, label: newT.defLabelA };
                    if (r.label === oldT.defLabelB) return { ...r, label: newT.defLabelB };
                    return r;
                });
                
                const posMapping = {
                    hu: { bf: 'tl', jf: 'tr', ba: 'bl', ja: 'br' },
                    en: { tl: 'bf', tr: 'jf', bl: 'ba', br: 'ja' }
                };
                if (posMapping[lang][nPos]) setNPos(posMapping[lang][nPos]);

                setRows(updatedRows);
                setLang(newLang);
            };

            const totalSum = rows.reduce((acc, row) => acc + (parseFloat(row.pct) || 0), 0);
            const targetN = parseFloat(n) || 0;
            const is100 = Math.abs(totalSum - 100) < 0.01;
            const isSumMatchingN = Math.abs(totalSum - targetN) < 0.01;
            const hasExceededN = totalSum > targetN;
            const validatorError = showPct ? (totalSum > 100) : hasExceededN;
            const validatorSuccess = showPct ? is100 : isSumMatchingN;

            const reverseColors = () => {
                if (isMonochrome) return;
                const newRows = [...rows];
                const colors = newRows.map(r => r.color).reverse();
                newRows.forEach((r, i) => r.color = colors[i]);
                setRows(newRows);
            };

            const applyPalette = (palette) => {
                setIsMonochrome(false);
                const newRows = rows.map((r, i) => ({
                    ...r,
                    color: palette.colors[i % palette.colors.length]
                }));
                setRows(newRows);
            };

            const draw = useCallback((forExport = false) => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext("2d");
                const scale = 2; 
                const width = 700;
                const height = 500;
                canvas.width = width * scale;
                canvas.height = height * scale;
                ctx.scale(scale, scale);
                ctx.clearRect(0, 0, width, height);
                
                let bgStyle = "transparent";
                if (downloadMode === "white") bgStyle = "white";
                else if (downloadMode === "dark") bgStyle = "#14161b";

                if (bgStyle !== "transparent") {
                    ctx.fillStyle = bgStyle;
                    ctx.fillRect(0, 0, width, height);
                }

                const valid = rows.filter(r => r.label && r.pct !== "");
                if (!valid.length) return;

                const pcts = valid.map(r => parseFloat(r.pct) || 0);
                const maxV = Math.max(...pcts, 10);
                const total = pcts.reduce((a, b) => a + b, 0);
                const norm = total > 0 ? pcts.map(p => p / total) : pcts.map(() => 1 / valid.length);
                const colors = valid.map(r => isMonochrome ? monoColor : r.color);
                const labelText = (v) => showPct ? `${v}%` : v;
                
                const textColor = (bgStyle === "white" || (bgStyle === "transparent" && !isDarkMode)) ? "#18181b" : "#f4f4f5";

                const wrapText = (text, x, y, maxWidth, lineHeight) => {
                    const words = text.split(' ');
                    let line = '';
                    let currentY = y;
                    for (let n = 0; n < words.length; n++) {
                        let testLine = line + words[n] + ' ';
                        if (ctx.measureText(testLine).width > maxWidth && n > 0) {
                            ctx.fillText(line, x, currentY);
                            line = words[n] + ' ';
                            currentY += lineHeight;
                        } else { line = testLine; }
                    }
                    ctx.fillText(line, x, currentY);
                };

                ctx.font = "600 14px 'Plus Jakarta Sans', sans-serif";

                if (chartType === "donut" || chartType === "pie") {
                    const cx = width / 2, cy = height / 2, r = 125;
                    let angle = -Math.PI / 2;
                    norm.forEach((frac, i) => {
                        const sweep = frac * 2 * Math.PI;
                        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, angle, angle + sweep);
                        ctx.fillStyle = colors[i]; ctx.fill();
                        if (bgStyle !== "transparent") {
                            ctx.strokeStyle = bgStyle; ctx.lineWidth = 3; ctx.stroke();
                        } else {
                            ctx.strokeStyle = "rgba(255,255,255,0.8)"; ctx.lineWidth = 2; ctx.stroke();
                        }
                        const mid = angle + sweep / 2;
                        const lx = cx + Math.cos(mid) * (r + 45), ly = cy + Math.sin(mid) * (r + 45);
                        ctx.textAlign = Math.cos(mid) > 0 ? "left" : "right";
                        ctx.fillStyle = colors[i];
                        wrapText(`${valid[i].label} (${labelText(pcts[i])})`, lx, ly, 140, 16);
                        angle += sweep;
                    });
                    if (chartType === "donut") {
                        if (bgStyle === "transparent") {
                            ctx.globalCompositeOperation = 'destination-out';
                            ctx.beginPath(); ctx.arc(cx, cy, r * 0.6, 0, 2 * Math.PI);
                            ctx.fillStyle = "rgba(0,0,0,1)"; ctx.fill();
                            ctx.globalCompositeOperation = 'source-over';
                        } else {
                            ctx.beginPath(); ctx.arc(cx, cy, r * 0.6, 0, 2 * Math.PI);
                            ctx.fillStyle = bgStyle; ctx.fill();
                        }
                    }
                }
                else if (chartType === "bar") {
                    const aW = 450, aH = 250, sp = aW / Math.max(valid.length, 1), bW = Math.min(sp * 0.7, 60), startX = (width - (valid.length * sp)) / 2;
                    valid.forEach((row, i) => {
                        const bh = (pcts[i] / maxV) * aH, bx = startX + i * sp + (sp - bW) / 2, by = height - 130 - bh;
                        ctx.fillStyle = colors[i]; ctx.beginPath(); ctx.roundRect(bx, by, bW, bh, [8, 8, 0, 0]); ctx.fill();
                        ctx.textAlign = "center"; ctx.fillStyle = textColor; ctx.fillText(labelText(pcts[i]), bx + bW/2, by - 12);
                        ctx.font = "500 12px 'Plus Jakarta Sans'"; wrapText(row.label, bx + bW/2, height - 100, sp * 0.9, 14); ctx.font = "600 12px 'Plus Jakarta Sans'";
                    });
                }
                else if (chartType === "hbar") {
                    const PL = 150, PR = 100, aW = width - PL - PR, rowH = 50, startY = (height - (valid.length * rowH)) / 2;
                    valid.forEach((row, i) => {
                        const bw = (pcts[i] / maxV) * aW, bH = 32, by = startY + i * rowH + (rowH - bH) / 2;
                        ctx.fillStyle = isDarkMode ? "#27272a" : "#f4f4f5"; ctx.beginPath(); ctx.roundRect(PL, by, aW, bH, 8); ctx.fill();
                        ctx.fillStyle = colors[i]; ctx.beginPath(); ctx.roundRect(PL, by, bw, bH, 8); ctx.fill();
                        ctx.textAlign = "right"; ctx.fillStyle = textColor; ctx.fillText(row.label, PL - 20, by + bH/2 + 5);
                        ctx.textAlign = "left"; ctx.fillText(labelText(pcts[i]), PL + bw + 15, by + bH/2 + 5);
                    });
                }
                else if (chartType === "line" || chartType === "scatter") {
                    const PL=100, PR=100, PT=100, PB=140, aW = width-PL-PR, aH = height-PT-PB, step = valid.length > 1 ? aW / (valid.length - 1) : 0, startX = valid.length > 1 ? PL : width / 2, ys = pcts.map(p => height - PB - (p / maxV) * aH);
                    if (chartType === "line") {
                        ctx.beginPath(); ctx.moveTo(startX, ys[0]); valid.forEach((_, i) => ctx.lineTo(startX + i * step, ys[i]));
                        ctx.strokeStyle = colors[0]; ctx.lineWidth = 5; ctx.stroke();
                    }
                    valid.forEach((row, i) => {
                        const x = startX + i * step, y = ys[i];
                        ctx.beginPath(); ctx.arc(x, y, chartType === "scatter" ? 14 : 7, 0, Math.PI * 2);
                        ctx.fillStyle = chartType === "scatter" ? colors[i] : (bgStyle === "transparent" ? (isDarkMode ? "#14161b" : "#fff") : bgStyle);
                        ctx.fill(); ctx.strokeStyle = colors[i]; ctx.lineWidth = 3; ctx.stroke();
                        ctx.textAlign = "center"; ctx.fillStyle = textColor; ctx.fillText(labelText(pcts[i]), x, y - 20);
                        ctx.font = "500 11px 'Plus Jakarta Sans'"; wrapText(row.label, x, height - PB + 30, (aW/valid.length)*0.9, 13); ctx.font = "600 11px 'Plus Jakarta Sans'";
                    });
                }

                if (showN && n) {
                    ctx.font = "italic 500 16px 'JetBrains Mono'"; ctx.fillStyle = isDarkMode ? "#a1a1aa" : "#71717a";
                    const txt = `n = ${n}`, tw = ctx.measureText(txt).width;
                    let nx = 40, ny = 50, pos = nPos.toLowerCase();
                    if (pos === "jf" || pos === "tr") nx = width - tw - 40;
                    else if (pos === "ba" || pos === "bl") ny = height - 40;
                    else if (pos === "ja" || pos === "br") { nx = width - tw - 40; ny = height - 40; }
                    ctx.textAlign = "left"; ctx.fillText(txt, nx, ny);
                }
            }, [rows, chartType, n, nPos, showN, showPct, isDarkMode, downloadMode, isMonochrome, monoColor, lang]);

            useEffect(() => draw(), [draw]);

            const handleDownload = () => {
                draw(true); 
                setTimeout(() => {
                    const link = document.createElement("a");
                    link.download = `diagram_hd.png`;
                    link.href = canvasRef.current.toDataURL("image/png", 1.0);
                    link.click();
                    draw(false); 
                }, 50);
            };

            const inputClasses = "w-full bg-zinc-50 dark:bg-[#0c0d10] border border-zinc-300 dark:border-zinc-700/90 rounded-xl py-2 px-3 text-sm font-medium text-zinc-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-shadow";

            return (
                <div id="app-container">
                    <div className="fixed inset-x-0 top-0 h-64 bg-gradient-to-b from-indigo-600/[0.04] dark:from-indigo-500/[0.05] to-transparent pointer-events-none -z-10"></div>
                    
                    <header className="sticky top-0 z-30 backdrop-blur-xl bg-[#f4f4f0]/85 dark:bg-[#0c0d10]/85 border-b border-zinc-200/80 dark:border-zinc-800/80">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap items-center justify-between gap-3">
                            <div className="flex items-center gap-3.5">
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-600 to-indigo-800 dark:from-indigo-500 dark:to-indigo-700 flex items-center justify-center text-white shadow-md shadow-indigo-900/10 shrink-0">
                                    <Icons.Chart />
                                </div>
                                <div>
                                    <div className="flex flex-wrap items-center gap-2">
                                        <h1 className="text-sm sm:text-base font-bold tracking-tight text-zinc-900 dark:text-white leading-tight">
                                            {t.title}
                                        </h1>
                                        <span className="text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-indigo-500/10 dark:bg-indigo-400/10 text-indigo-800 dark:text-indigo-300 border border-indigo-600/20 dark:border-indigo-400/20">
                                            {t.creator}
                                        </span>
                                    </div>
                                    <p className="text-xs text-zinc-500 dark:text-zinc-400 hidden sm:block mt-0.5">
                                        {t.subtitle}
                                    </p>
                                </div>
                            </div>

                            <div className="flex items-center gap-2">
                                <div className="inline-flex rounded-xl p-1 bg-zinc-200/75 dark:bg-zinc-900 border border-zinc-300/60 dark:border-zinc-800">
                                    <button onClick={() => toggleLang()} className={`px-2.5 py-1 text-xs font-semibold rounded-lg transition-all shadow-sm ${lang === 'hu' ? 'bg-white dark:bg-zinc-800 text-indigo-700 dark:text-indigo-400' : 'text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white'}`}>
                                        HU
                                    </button>
                                    <button onClick={() => toggleLang()} className={`px-2.5 py-1 text-xs font-semibold rounded-lg transition-all ${lang === 'en' ? 'bg-white dark:bg-zinc-800 text-indigo-700 dark:text-indigo-400 shadow-sm' : 'text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white'}`}>
                                        EN
                                    </button>
                                </div>

                                <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2 rounded-xl bg-zinc-200/75 dark:bg-zinc-900 text-zinc-700 dark:text-zinc-300 hover:bg-zinc-300/70 dark:hover:bg-zinc-800 border border-zinc-300/60 dark:border-zinc-800 transition-colors">
                                    {isDarkMode ? <Icons.Sun /> : <Icons.Moon />}
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 relative">
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8 items-start">
                            
                            {/* BAL OLDAL - VEZÉRLŐK */}
                            <div className="lg:col-span-5 space-y-6">
                                <section className="card-surface bg-white dark:bg-[#14161b] rounded-2xl border border-zinc-200/90 dark:border-zinc-800/90 shadow-sm p-5 sm:p-6 space-y-5">
                                    
                                    <SectionHeader icon={<Icons.Layers />} title={t.sec1} />
                                    <div className="grid grid-cols-3 gap-2">
                                        {CHART_TYPES(lang).map(ti => (
                                            <button key={ti.id} onClick={() => setChartType(ti.id)} 
                                                className={`py-2 px-2 rounded-xl font-semibold text-xs transition-all border ${chartType === ti.id ? "bg-indigo-600 border-indigo-600 text-white shadow-sm" : "bg-zinc-50 dark:bg-[#0c0d10] border-zinc-200 dark:border-zinc-800 text-zinc-600 dark:text-zinc-400 hover:border-indigo-500/50"}`}>
                                                {ti.icon} {ti.label}
                                            </button>
                                        ))}
                                    </div>

                                    <SectionHeader icon={<Icons.Palette />} title={t.sec2} />
                                    <div className="grid grid-cols-3 gap-2">
                                        {PALETTES(lang).map((p, i) => (
                                            <button key={i} onClick={() => applyPalette(p)} className="p-2.5 rounded-xl bg-zinc-50 dark:bg-[#0c0d10] border border-zinc-200/80 dark:border-zinc-800 flex flex-col gap-1.5 items-center hover:border-indigo-500/50 transition-colors">
                                                <div className="flex gap-1">
                                                    {p.colors.slice(0, 4).map((c, ci) => <div key={ci} className="w-2 h-2 rounded-full" style={{background: c}} />)}
                                                </div>
                                                <span className="text-[10px] font-bold text-zinc-600 dark:text-zinc-400">{p.name}</span>
                                            </button>
                                        ))}
                                    </div>

                                    <SectionHeader icon={<Icons.Settings />} title={t.sec3} />
                                    <div className="flex justify-between items-center bg-zinc-50 dark:bg-[#0c0d10] px-4 py-3 rounded-xl border border-zinc-200/80 dark:border-zinc-800">
                                        <span className="text-sm font-semibold text-zinc-700 dark:text-zinc-200">{t.mono}</span>
                                        <div className="flex items-center gap-3">
                                            {isMonochrome && (
                                                <div className="w-6 h-6 rounded-md color-picker-wrapper shadow-sm border border-zinc-200 dark:border-zinc-700" style={{background: monoColor}}>
                                                    <input type="color" value={monoColor} onChange={e => setMonoColor(e.target.value)} />
                                                </div>
                                            )}
                                            <Toggle value={isMonochrome} onChange={setIsMonochrome} isDark={isDarkMode} />
                                        </div>
                                    </div>

                                    <div className="space-y-3">
                                        {rows.map((r, i) => (
                                            <div key={i} className="flex gap-2 items-center">
                                                {!isMonochrome ? (
                                                    <div className="w-9 h-9 rounded-xl color-picker-wrapper shadow-sm border border-zinc-200 dark:border-zinc-700" style={{background: r.color}}>
                                                        <input type="color" value={r.color} onChange={(e) => {
                                                            const nr = [...rows]; nr[i].color = e.target.value; setRows(nr);
                                                        }} />
                                                    </div>
                                                ) : (
                                                    <div className="w-9 h-9 rounded-xl shadow-sm opacity-90 shrink-0" style={{background: monoColor}}></div>
                                                )}
                                                <input className={inputClasses} value={r.label} onChange={(e) => {
                                                    const nr = [...rows]; nr[i].label = e.target.value; setRows(nr);
                                                }} placeholder={t.placeholderName} />
                                                <div className="relative w-20 shrink-0">
                                                    <input className={`${inputClasses} pr-7 text-right ${validatorError ? "text-rose-600 dark:text-rose-400 border-rose-300 dark:border-rose-800" : "font-mono"}`} value={r.pct} onChange={(e) => {
                                                        const nr = [...rows]; nr[i].pct = e.target.value; setRows(nr);
                                                    }} />
                                                    <span className="absolute right-2.5 top-2 text-xs font-bold text-zinc-400 pointer-events-none">{showPct ? "%" : "x"}</span>
                                                </div>
                                                <button onClick={() => setRows(rows.filter((_, idx) => idx !== i))} className="p-2 text-zinc-400 hover:text-rose-500 transition-colors"><Icons.Trash /></button>
                                            </div>
                                        ))}
                                    </div>

                                    {totalSum > 0 && (
                                        <div className={`p-3 rounded-xl border flex items-center justify-between ${validatorError ? "bg-rose-50 dark:bg-rose-950/20 border-rose-200 dark:border-rose-800/60" : "bg-indigo-50 dark:bg-indigo-950/20 border-indigo-200 dark:border-indigo-800/60"}`}>
                                            <span className={`text-xs font-semibold ${validatorError ? "text-rose-700 dark:text-rose-400" : "text-indigo-700 dark:text-indigo-400"}`}>
                                                {validatorError ? (showPct ? t.warning100 : t.warningN) : (showPct ? t.total : t.totalN)}
                                            </span>
                                            <span className={`text-sm font-bold font-mono ${validatorError ? "text-rose-700 dark:text-rose-400" : "text-indigo-700 dark:text-indigo-400"}`}>
                                                {showPct ? `${totalSum.toFixed(1)}%` : `${totalSum} / ${targetN}`}
                                            </span>
                                        </div>
                                    )}

                                    <div className="flex gap-2">
                                        {!isMonochrome && <button onClick={reverseColors} className="flex-1 py-2.5 rounded-xl bg-zinc-100 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300 font-semibold text-xs border border-zinc-200 dark:border-zinc-700 hover:bg-zinc-200 dark:hover:bg-zinc-700 transition-colors">{t.btnReverse}</button>}
                                        <button onClick={() => setRows([...rows, {label: "", pct: "", color: "#e4e4e7"}])} className="flex-[2] py-2.5 rounded-xl border border-dashed border-indigo-500/50 text-indigo-600 dark:text-indigo-400 font-bold text-xs hover:bg-indigo-50 dark:hover:bg-indigo-950/30 transition-colors">{t.btnAdd}</button>
                                    </div>

                                    <SectionHeader icon={<Icons.Download />} title={t.sec4} />
                                    <div className="space-y-4 bg-zinc-50 dark:bg-[#0c0d10] p-4 rounded-xl border border-zinc-200/80 dark:border-zinc-800">
                                        <div className="flex justify-between items-center">
                                            <span className="text-sm font-semibold text-zinc-700 dark:text-zinc-200">{t.showPct}</span>
                                            <Toggle value={showPct} onChange={setShowPct} isDark={isDarkMode} />
                                        </div>
                                        <div className="flex justify-between items-center">
                                            <span className="text-sm font-semibold text-zinc-700 dark:text-zinc-200">{t.showN}</span>
                                            <Toggle value={showN} onChange={setShowN} isDark={isDarkMode} />
                                        </div>
                                        {showN && (
                                            <div className="pt-2 border-t border-zinc-200/60 dark:border-zinc-800/80">
                                                <input className={`${inputClasses} mb-2`} type="text" value={n} onChange={(e) => setN(e.target.value)} placeholder={t.placeholderN} />
                                                <div className="grid grid-cols-4 gap-1.5 p-1 rounded-xl bg-zinc-200/70 dark:bg-zinc-900 border border-zinc-300/50 dark:border-zinc-800">
                                                    {(lang === 'hu' ? [['bf', 'BF'],['jf', 'JF'],['ba', 'BA'],['ja', 'JA']] : [['tl', 'TL'],['tr', 'TR'],['bl', 'BL'],['br', 'BR']]).map(([p, l]) => (
                                                        <button key={p} onClick={() => setNPos(p)} className={`py-1.5 text-[11px] font-bold rounded-lg transition-all ${nPos === p ? "bg-white dark:bg-zinc-800 text-indigo-600 dark:text-indigo-400 shadow-sm" : "text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white"}`}>{l}</button>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                        <div className="pt-3 border-t border-zinc-200/60 dark:border-zinc-800/80">
                                            <span className="text-[10px] font-bold text-zinc-500 uppercase tracking-wider mb-2 block">{t.saveBg}</span>
                                            <div className="flex gap-1.5 p-1 rounded-xl bg-zinc-200/70 dark:bg-zinc-900 border border-zinc-300/50 dark:border-zinc-800">
                                                {[["white", t.bgWhite], ["dark", t.bgDark], ["transparent", t.bgNone]].map(([m, l]) => (
                                                    <button key={m} onClick={() => setDownloadMode(m)} className={`flex-1 py-1.5 text-[11px] font-bold rounded-lg transition-all ${downloadMode === m ? "bg-white dark:bg-zinc-800 text-indigo-600 dark:text-indigo-400 shadow-sm" : "text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white"}`}>{l}</button>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                    <button onClick={handleDownload} className="w-full py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-md shadow-indigo-900/20 transition-all flex justify-center items-center gap-2">
                                        <Icons.Download /> {t.btnDownload}
                                    </button>
                                </section>
                            </div>

                            {/* JOBB OLDAL - RAGADÓS CANVAS */}
                            <div className="lg:col-span-7 space-y-6 order-first lg:order-last lg:sticky lg:top-24 z-10">
                                <section className={`card-surface rounded-2xl border shadow-sm p-2 sm:p-4 flex items-center justify-center min-h-[400px] transition-colors ${downloadMode === 'white' ? 'bg-white border-zinc-200/90' : (downloadMode === 'dark' ? 'bg-[#14161b] border-zinc-800/90' : 'bg-transparent border-dashed border-zinc-300 dark:border-zinc-700')}`}>
                                    <canvas ref={canvasRef} className="max-w-full h-auto" />
                                </section>
                            </div>

                        </div>
                    </main>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
